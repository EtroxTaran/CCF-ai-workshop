name: CI — Validate Modules, Build UI & Verify Repository

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "workshop-ui/package-lock.json"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild and verify modular bundles
        run: |
          node scripts/build_modules.mjs
          node scripts/validate_modules.mjs

      - name: Typecheck and build Workshop UI
        working-directory: workshop-ui
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Run full repository verification suite
        run: python scripts/verify_workshop.py --skip-pptx
